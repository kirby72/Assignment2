name: Build HTML and CSS
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - run:  gem install jekyll && jekyll build
      - uses: actions/upload-artifact@v4
        with:
          name: website-html-css
          path: _site/
